<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="canonical" href="https://zingersoftwaresolutions.com/zinpulse.html">
    <meta name="theme-color" content="#0a1020">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%230f1a30'/%3E%3Cpath d='M10 10.5h12L10 21.5h12' fill='none' stroke='%234ecdc4' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/site.css">
    <script>
    // Smart link for social bios and posts: zingersoftwaresolutions.com/get?src=tiktok
    // iPhone/iPad -> App Store, Android -> Google Play, anything else -> this page.
    // src is passed on as the store campaign so installs can be told apart by channel.
    (function () {
        var src = (new URLSearchParams(location.search).get('src') || 'get').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 32) || 'get';
        var ua = navigator.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var appStore = 'https://apps.apple.com/app/id6828517395?ct=' + src;
        var play = 'https://play.google.com/store/apps/details?id=com.zingersoftware.zinpulse&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=smart_link');
        // IOS_LIVE: set to true once ZinPulse is on the App Store (Android-first launch until then).
        var IOS_LIVE = false;
        window.ZP_LINKS = { appStore: appStore, play: play, ios: ios, iosLive: IOS_LIVE };
        if (ios && IOS_LIVE) location.replace(appStore);
        else if (/Android/i.test(ua)) location.replace(play);
    })();
    </script>
    <style>
        body { background: var(--ink); }
        .get-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; text-align: center; background: var(--ink); color: #e6ecf5; }
        .get-wrap a:not(.btn) { color: var(--teal); }
        .get-card { max-width: 480px; }
        .get-card h1 { margin: 16px 0 8px; }
        .get-card p { margin: 0 0 24px; }
        .get-card .store-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <main class="get-wrap dark" id="main">
        <div class="get-card">
            <h1>Get ZinPulse</h1>
            <p class="lede">The AI workout coach that shows its work. Try everything free for 7 days.</p>
            <div class="store-row">
                <a id="get-ios" href="https://apps.apple.com/app/id6828517395?ct=get" class="btn btn-store" aria-label="Download on the App Store"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span><small>Download on the</small><strong>App Store</strong></span></a>
                <a id="get-play" href="https://play.google.com/store/apps/details?id=com.zingersoftware.zinpulse&amp;referrer=utm_source%3Dget%26utm_medium%3Dsmart_link" class="btn btn-store" aria-label="Get it on Google Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg><span><small>Get it on</small><strong>Google Play</strong></span></a>
            </div>
            <p style="margin-top:24px"><a href="../zinpulse.html">More about ZinPulse</a></p>
        </div>
    </main>
    <script>
    // On a computer the buttons carry the same channel tag as the redirect would have.
    if (window.ZP_LINKS) {
        var iosBtn = document.getElementById('get-ios');
        iosBtn.href = window.ZP_LINKS.appStore;
        document.getElementById('get-play').href = window.ZP_LINKS.play;
        if (!window.ZP_LINKS.iosLive) {
            iosBtn.classList.add('btn-soon');
            iosBtn.removeAttribute('href');
            iosBtn.setAttribute('aria-disabled', 'true');
            iosBtn.querySelector('small').textContent = 'Coming soon on the';
            if (window.ZP_LINKS.ios) {
                document.querySelector('.get-card h1').textContent = 'ZinPulse for iPhone is coming soon';
                document.querySelector('.get-card .lede').textContent = 'It is in Apple’s review right now. ZinPulse is already on Google Play for Android phones.';
            }
        }
    }
    </script>
</body>
